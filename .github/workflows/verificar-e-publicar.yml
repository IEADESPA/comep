name: Verificar e publicar

# Em todo pull request: lint, testes das regras do banco e build.
# Ao entrar na branch main: os mesmos passos e, se tudo passar, publica no GitHub Pages.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (inclui a regra de portabilidade)
        run: npm run lint

      - name: Testes das regras do banco (RLS, nada se apaga, auditoria)
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Informações PÚBLICAS do projeto Supabase de produção (variáveis do repositório, não segredos)
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      - name: Links diretos (ex.: validação da carteirinha) abrem o app no GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Guardar o site para publicação
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publicar:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
