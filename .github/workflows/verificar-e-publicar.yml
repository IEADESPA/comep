name: Verificar e publicar

# Em todo pull request: lint, testes das regras do banco e build; e o ponta a ponta, se o PR mexe em algo além
# de documentação.
# Ao entrar na branch main: lint, testes e build e, se tudo passar, publica no GitHub Pages. O ponta a ponta NÃO
# roda de novo na main: o PR já testou o mesmo código, porque a proteção da main exige o PR em dia com ela
# ("strict") antes do merge. Decisão do presidente de 25/11/2026: cada rodada completa do ponta a ponta gera
# ~17 mil pedidos no comep-teste, e a cota de logs do Supabase (1 GB/mês) estourou.
# O workflow_dispatch (rodar à mão) roda tudo, inclusive o ponta a ponta.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mudancas:
    # Diz se o PR mexe em algo além de documentação (*.md, docs/ e .claude/). Só documentação = sem ponta a ponta.
    # O ponta a ponta pulado conta como aprovado na proteção da main (o GitHub trata o job pulado como sucesso).
    name: O que o PR muda
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.conferir.outputs.codigo }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: conferir
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TOPO: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENTO" != "pull_request" ]; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          arquivos=$(git diff --name-only "$BASE...$TOPO")
          echo "Arquivos mudados:"
          echo "$arquivos"
          fora_da_doc=$(echo "$arquivos" | grep -v -E '(\.md$|^docs/|^\.claude/)' || true)
          if [ -n "$fora_da_doc" ]; then
            echo "Mexe em algo além de documentação:"
            echo "$fora_da_doc"
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "Só documentação: o ponta a ponta não roda."
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          fi

  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (inclui a regra de portabilidade)
        run: npm run lint

      - name: Testes das regras do banco (RLS, nada se apaga, auditoria)
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Site OFICIAL (/comep/): informações PÚBLICAS do projeto Supabase (variáveis do repositório, não segredos).
          # Até o lançamento da versão 1.0 apontam para o comep-teste, com AMBIENTE=teste (faixa amarela no site);
          # no lançamento passam para o comep-producao, com AMBIENTE vazio (docs/lancamento.md).
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_AMBIENTE: ${{ vars.AMBIENTE }}
          # a chave PÚBLICA do envio dos avisos no celular (docs/avisos-no-celular.md); vazia = o envio ainda não foi ligado
          VITE_VAPID_PUBLICA: ${{ vars.VAPID_PUBLICA }}

      - name: Build do ambiente de teste (/comep/teste/, sempre no banco de teste)
        run: npx vite build --outDir dist/teste
        env:
          VITE_BASE: /comep/teste/
          VITE_SUPABASE_URL: ${{ vars.TESTE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.TESTE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AMBIENTE: teste
          VITE_VAPID_PUBLICA: ${{ vars.TESTE_VAPID_PUBLICA }}

      - name: "Links diretos (ex.: validação da carteirinha) abrem o app no GitHub Pages"
        # O 404.html é o app oficial; links do ambiente de teste são redirecionados por ele (index.html)
        run: cp dist/index.html dist/404.html

      - name: Guardar o site para publicação
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  ponta-a-ponta:
    # Trava 3 (PROJETO.md, seção 14): um navegador de verdade usa o app ligado ao banco de TESTE,
    # com usuários fictícios de cada perfil, em tamanho de computador e de celular.
    name: Testes de ponta a ponta (banco de teste)
    needs: [mudancas]
    # Não roda no push da main (o PR já testou) nem em PR só de documentação; roda à mão (workflow_dispatch).
    # Na dúvida, roda: se o "O que o PR muda" falhar, a saída fica vazia (não "false") e o ponta a ponta roda.
    # O !cancelled() (e não always()) deixa o push novo no PR cancelar esta rodada, como antes.
    if: ${{ !cancelled() && github.event_name != 'push' && needs.mudancas.outputs.codigo != 'false' }}
    runs-on: ubuntu-latest
    # 145 testes (computador e celular) passaram dos 20 minutos em 18/11/2026; com folga para a nova tentativa.
    # Em 20/11/2026, com o Financeiro e o Conselho Fiscal, a verificação da main foi cortada aos 30 minutos
    # com os testes ainda passando (o PR #49 levou 26 minutos): o limite subiu para 45.
    timeout-minutes: 45
    # Um de cada vez: todos usam o mesmo banco de teste e os mesmos usuários fictícios
    # (duas execuções ao mesmo tempo mexem no mesmo caixa, no mesmo balanço e nos mesmos perfis).
    concurrency:
      group: ponta-a-ponta-banco-de-teste
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build ligado ao banco de teste
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.TESTE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.TESTE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AMBIENTE: teste
          VITE_VAPID_PUBLICA: ${{ vars.TESTE_VAPID_PUBLICA }}

      - name: Navegador
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "E2E_CANAL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
            echo "E2E_CANAL=chromium" >> "$GITHUB_ENV"
          fi

      - name: Testes de ponta a ponta
        run: npx playwright test
        env:
          E2E_SENHA_PRESIDENCIA: ${{ secrets.E2E_SENHA_PRESIDENCIA }}
          E2E_SENHA_MINISTRO: ${{ secrets.E2E_SENHA_MINISTRO }}
          E2E_SENHA_SEM_PERFIL: ${{ secrets.E2E_SENHA_SEM_PERFIL }}
          E2E_SENHA_TESOURARIA: ${{ secrets.E2E_SENHA_TESOURARIA }}
          E2E_SENHA_CONSELHO: ${{ secrets.E2E_SENHA_CONSELHO }}
          E2E_SENHA_PRESIDENTE_IGREJA: ${{ secrets.E2E_SENHA_PRESIDENTE_IGREJA }}
      # Nada do ponta a ponta sobe como artefato: o repositório é público, e o rastro (trace) do Playwright guardava a
      # senha digitada no login e a sessão das contas de teste (23/11/2026). O log do reporter "list" basta; no
      # GitHub, o playwright.config.ts não grava rastro nem foto.

  publicar:
    name: Publicar no GitHub Pages
    # O always() deixa publicar com o ponta a ponta PULADO (push da main: o PR já testou); se ele rodou (à mão, pelo
    # workflow_dispatch), só publica com ele aprovado.
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.verificar.result == 'success' &&
      (needs.ponta-a-ponta.result == 'success' || needs.ponta-a-ponta.result == 'skipped')
    needs: [verificar, ponta-a-ponta]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
